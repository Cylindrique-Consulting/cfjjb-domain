name: CI

on:
  push:
    branches: [main]
  pull_request:

# Groupe indexé sur le SHA pour un push et sur la ref pour une PR : une fusion
# ne doit jamais annuler le run de `main` qu'elle vient de créer. Un job annulé
# n'apparaît pas en rouge — il disparaît, et l'absence de signal se lit comme
# une réussite.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualite:
    name: Qualité (format, lint, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  purete:
    name: Pureté du noyau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # POURQUOI UN JOB SÉPARÉ ALORS QU'ESLINT COUVRE DÉJÀ LES IMPORTS.
      #
      # La règle eslint ne voit que ce qu'un fichier IMPORTE. Elle ne voit pas
      # une dépendance de production ajoutée au package.json — or c'est
      # exactement par là qu'un noyau « pur » cesse de l'être, et ça ne casse
      # aucun test. Ce job lit le manifeste, pas le code.
      - name: Aucune dépendance de production
        run: |
          deps=$(node -e "const p=require('./package.json');console.log(Object.keys(p.dependencies??{}).join(' '))")
          if [ -n "$deps" ]; then
            echo "::error::@cfjjb/domain doit rester sans dépendance de production. Trouvé : $deps"
            exit 1
          fi
          echo "Aucune dépendance de production."
